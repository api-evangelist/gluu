- name: Janssen all-in-one / monolith deployment
  kind: local-test-deployment
  docs: https://docs.jans.io/stable/janssen-server/install/
  detail: >-
    A single-container Janssen Server (docker-jans-all-in-one, docker-jans-monolith in the repo) that
