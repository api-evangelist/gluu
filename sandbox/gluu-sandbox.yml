shape: self-hosted-test-deployment-plus-hosted-console
note: >-
  There is no hosted API sandbox with test keys, because there is no hosted API: Gluu Flex and the Janssen
  Server are software a customer runs. The equivalent of a sandbox here is a disposable local deployment
  plus first-party test clients. No test credentials, test cards or magic identifiers are published, and
  none are invented below.
test_credentials:
  published: false
  detail: >-
    No test-vs-live key prefixes, no published test tokens, no seeded demo accounts. Credentials on a test
    deployment are the ones its own setup generates. Nothing to record.
