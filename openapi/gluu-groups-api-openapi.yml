openapi: 3.1.0
info:
  title: Gluu Flex SCIM 2.0 discovery groups API
  version: '1.0'
  description: 'SCIM 2.0 (RFC 7644) endpoints exposed by Gluu Flex / Janssen Server for

    cross-domain identity management. The default base path on a Gluu Flex

    deployment is `/jans-scim/restv1`. Authentication uses an OAuth 2.0

    Bearer access token obtained from the embedded authorization server

    with the appropriate SCIM scopes.

    '
  contact:
    name: Gluu
    url: https://docs.gluu.org/
servers:
- url: https://{host}/jans-scim/restv1
  description: Gluu Flex SCIM endpoint
  variables:
    host:
      default: idp.example.com
security:
- bearerAuth: []
tags:
- name: groups
paths:
  /v2/Groups:
    get:
      tags:
      - groups
      summary: Query groups
      operationId: searchGroups
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: startIndex
        in: query
        schema:
          type: integer
      - name: count
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: ListResponse
    post:
      tags:
      - groups
      summary: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
      responses:
        '201':
          description: Group created
  /v2/Groups/.search:
    post:
      tags:
      - groups
      summary: Search groups with a SearchRequest body
      operationId: searchGroupsPost
      responses:
        '200':
          description: ListResponse
  /v2/Groups/{id}:
    get:
      tags:
      - groups
      summary: Get a group
      operationId: getGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group
    put:
      tags:
      - groups
      summary: Replace a group
      operationId: replaceGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group
    patch:
      tags:
      - groups
      summary: Patch a group
      operationId: patchGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group
    delete:
      tags:
      - groups
      summary: Delete a group
      operationId: deleteGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 access token with SCIM scopes
