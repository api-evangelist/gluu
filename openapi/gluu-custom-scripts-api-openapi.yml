components:
  schemas:
    PagedResult:
      type: object
      properties:
        start:
          type: integer
          format: int32
        totalEntriesCount:
          type: integer
          format: int32
        entriesCount:
          type: integer
          format: int32
        entries:
          type: array
          items:
            type: object
    CustomScript:
      type: object
      properties:
        dn:
          type: string
        inum:
          type: string
        name:
          maxLength: 60
          minLength: 2
          pattern: ^[a-zA-Z0-9_\-\:\/\.]+$
          type: string
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        script:
          type: string
        scriptType:
          type: string
          enum:
          - person_authentication
          - authorization_challenge
          - introspection
          - resource_owner_password_credentials
          - application_session
          - link_interception
          - client_registration
          - id_generator
          - uma_rpt_policy
          - uma_rpt_claims
          - uma_claims_gathering
          - access_evaluation
          - access_evaluation_discovery
          - token_exchange
          - identity_assertion
          - consent_gathering
          - dynamic_scope
          - spontaneous_scope
          - end_session
          - post_authn
          - client_authn
          - select_account
          - create_user
          - scim
          - ciba_end_user_notification
          - revoke_token
          - persistence_extension
          - idp
          - discovery
          - cookie
          - health_check
          - authz_detail
          - update_token
          - tx_token
          - logout_status_jwt
          - par
          - config_api_auth
          - modify_ssa_response
          - fido2_extension
          - lock_extension
        programmingLanguage:
          type: string
          enum:
          - python
          - java
        moduleProperties:
          type: array
          items:
            $ref: '#/components/schemas/SimpleCustomProperty'
        configurationProperties:
          type: array
          items:
            $ref: '#/components/schemas/SimpleExtendedCustomProperty'
        level:
          type: integer
          format: int32
        revision:
          type: integer
          format: int64
        enabled:
          type: boolean
        scriptError:
          $ref: '#/components/schemas/ScriptError'
        modified:
          type: boolean
        internal:
          type: boolean
        locationType:
          type: string
          enum:
          - ldap
          - db
        baseDn:
          type: string
    JsonPatch:
      type: object
    SimpleExtendedCustomProperty:
      type: object
      properties:
        value1:
          type: string
        value2:
          type: string
        hide:
          type: boolean
        description:
          type: string
    SimpleCustomProperty:
      type: object
      properties:
        value1:
          type: string
        value2:
          type: string
        description:
          type: string
    ScriptError:
      type: object
      properties:
        raisedAt:
          type: string
          format: date-time
        stackTrace:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{op-hostname}/.../token
