urn true;\\n    }\\n}\\n\",\n    \"scriptType\": \"discovery\",\n    \"programmingLanguage\": \"java\",\n    \"moduleProperties\": [\n        {\n            \"value1\": \"location_type\",\n            \"value2\": \"db\"\n        }\n    ],\n    \"level\": 1,\n    \"revision\": 11,\n    \"enabled\": true,\n    \"modified\": false,\n    \"internal\": false,\n    \"locationType\": \"db\",\n    \"baseDn\": \"inum=0300-BA90,ou=scripts,o=jans\"\n}\n"
