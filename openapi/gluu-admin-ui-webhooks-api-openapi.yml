  version: 1.0.0
servers:
- url: https://jans.io/
  description: The Jans server
tags:
- name: Admin UI - Webhooks
paths:
  /admin-ui/webhook:
    get:
      tags:
      - Admin UI - Webhooks
      summary: Gets list of webhooks
      operationId: get-all-webhooks
      parameters:
      - name: limit
        in: query
        description: Search size - max size of the results to return
        schema:
          type: integer
          format: int32
          default: 50
      - name: pattern
        in: query
        description: Search pattern
        schema:
          type: string
          default: ''
      - name: startIndex
        in: query
        description: The 1-based index of the first query result
        schema:
          type: integer
          format: int32
          default: 0
      - name: sortBy
        in: query
        description: Attribute whose value will be used to order the returned response
        schema:
          type: string
          default: inum
      - name: sortOrder
        in: query
        description: Order in which the sortBy param is applied. Allowed values are "ascending" and "descending"
        schema:
          type: string
          default: ascending
      - name: fieldValuePair
        in: query
        description: Field and value pair for seraching
        schema:
          type: string
          default: ''
        examples:
          Field value example:
            description: Field value example
            value: scopeType=spontaneous,defaultScope=true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
              examples:
                Response json example:
                  description: Response json example
                  value: "{\n  \"start\": 0,\n  \"totalEntriesCount\": 2,\n  \"entriesCount\": 2,\n  \"entries\": [{\n    \"dn\": \"inum=aad9e1dd-87f3-357f-a2fa-93ae8eb94998,ou=auiWebhooks,ou=admin-ui,o=jans\",\n    \"inum\": \"aad9e1dd-87f3-357f-a2fa-93ae8eb94998\",\n    \"displayName\": \"test-5\",\n    \"description\": \"test1\",\n    \"url\": \"https://jsonplaceholder.typicode.com/posts\",\n    \"httpRequestBody\": \"{\\\"userId\\\": 11,\\\"id\\\": 11,\\\"title\\\": \\\"sunt aut facere repellat provident occaecati excepturi optio reprehenderit\\\",\\\"body\\\": \\\"quia et suscipitsutem sunt rem eveniet architecto\\\"}\",\n    \"httpMethod\": \"POST\",\n    \"jansEnabled\": true,\n    \"httpHeaders\": [{\n      \"key\": \"Content-Type\",\n      \"value\": \"application/json\"\n    }],\n    \"baseDn\": \"inum=aad9e1dd-87f3-357f-a2fa-93ae8eb94998,ou=auiWebhooks,ou=admin-ui,o=jans\"\n  }, {\n    \"dn\": \"inum=d23d60e8-0187-3878-94d9-30d594c4c986,ou=auiWebhooks,ou=admin-ui,o=jans\",\n    \"inum\": \"d23d60e8-0187-3878-94d9-30d594c4c986\",\n    \"displayName\": \"test-6\",\n    \"description\": \"test1\",\n    \"url\": \"https://jsonplaceholder.typicode.com/posts\",\n    \"httpRequestBody\": \"{\\\"userId\\\": 11,\\\"id\\\": 11,\\\"title\\\": \\\"sunt aut facere repellat provident occaecati excepturi optio reprehenderit\\\",\\\"body\\\": \\\"quia et suscipitsutem sunt rem eveniet architecto\\\"}\",\n    \"httpMethod\": \"POST\",\n    \"jansEnabled\": true,\n    \"httpHeaders\": [{\n      \"key\": \"Content-Type\",\n      \"value\": \"application/json\"\n    }],\n    \"baseDn\": \"inum=d23d60e8-0187-3878-94d9-30d594c4c986,ou=auiWebhooks,ou=admin-ui,o=jans\"\n  }]\n}\n"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      security:
      - oauth2:
        - https://jans.io/oauth/jans-auth-server/config/adminui/webhook.readonly
