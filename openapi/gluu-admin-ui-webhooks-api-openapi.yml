                value: "{\n  \"displayName\": \"posts-webhook-1\",\n  \"description\": \"posts-webhook description\",\n  \"url\": \"https://reqres.in/api/users\",\n  \"httpRequestBody\": {\n    \"name\": \"morpheus\",\n    \"job\": \"leader\"\n  },\n  \"httpMethod\": \"POST\",\n  \"jansEnabled\": true,\n  \"httpHeaders\":[{\"key\":\"Content-Type\", \"value\":\"application/json\"}],\n  \"auiFeatureIds\":[\"jans_link_write\"]\n}\n"
