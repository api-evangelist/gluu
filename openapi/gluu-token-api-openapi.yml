      properties:
        dn:
          type: string
        grantId:
          type: string
        userId:
          type: string
        userDn:
          type: string
        clientId:
          type: string
        creationDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        deletable:
          type: boolean
        authenticationTime:
          type: string
          format: date-time
        scope:
          type: string
        tokenCode:
          type: string
        tokenType:
          type: string
        grantType:
          type: string
        jwtRequest:
          type: string
        authorizationCode:
          type: string
        jti:
          type: string
        nonce:
          type: string
        codeChallenge:
          type: string
        codeChallengeMethod:
          type: string
