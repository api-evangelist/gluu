          type: integer
          format: int32
        entriesCount:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TokenEntity'
    TokenAttributes:
      type: object
      properties:
        x5cs256:
          type: string
        online_access:
          type: boolean
        authorization_challenge:
          type: boolean
        attributes:
          type: object
          additionalProperties:
            type: string
        dpopJkt:
          type: string
        authorizationDetails:
          type: string
        statusListIndex:
          type: integer
          format: int32
    TokenEntity:
