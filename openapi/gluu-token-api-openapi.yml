openapi: 3.2.0
info:
  title: Gluu Token API
  version: OAS Version
  contact:
    name: Contact
    url: https://github.com/JanssenProject/jans/discussions
  license:
    name: License
    url: https://github.com/JanssenProject/jans/blob/main/LICENSE
  description: 'Operations tagged Token across 2 of this provider''s published API definitions: gluu-jans-auth-server-openapi.yml, gluu-jans-config-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://jans.local.io/jans-auth
- url: https://jans.local.io
  description: The Jans server
tags:
- name: Token
paths:
  /restv1/introspection:
    get:
      tags:
      - Token
      summary: The Introspection OAuth 2 Endpoint
      description: The Introspection OAuth 2 Endpoint.
      operationId: get-introspection
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Client Authorization details that contains the access token along with other details.
        schema:
          type: string
        example: Bearer 23410913-abewfq.123483
      - name: token
        in: query
        required: true
        schema:
          type: string
        example: token=2YotnFZFEjr1zCsicMWpAA
      - name: token_type_hint
        in: query
        description: ID Token previously issued by the Authorization Server being passed as a hint about the End-User.
        schema:
          type: string
      - name: response_as_jwt
        in: query
        description: OPTIONAL. Boolean value with default value false. If true, returns introspection response as JWT (signed based on client configuration used for authentication to Introspection Endpoint).
        schema:
          type: boolean
        example: response_as_jwt=false
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                title: IntrospectionResponse
                description: meta-information about token
                required:
                - active
                type: object
                properties:
                  active:
                    type: boolean
                    description: Boolean indicator of whether or not the presented token is currently active.
                    example: true
                  scope:
                    type: array
                    description: Provide list of scopes to which access was granted for this resource.
                    example:
                    - read write dolphin
                    items:
                      type: string
                  client_id:
                    type: string
                    description: Client identifier for the OAuth 2.0 client that requested this token.
                    example: 1238j323ds-23ij4
                  username:
                    type: string
                    description: Human-readable identifier for the resource owner who authorized this token.
                    example: jdoe
                  token_type:
                    type: string
                    description: Type of the token as defined in Section 5.1 of OAuth 2.0 [RFC6749].
                    example: bearer, mac
                  exp:
                    type: integer
                    description: Integer timestamp, measured in the number of seconds since January 1 1970 UTC, indicating when this permission will expire.
                  iat:
                    type: integer
                    example: Integer timestamp, measured in the number of seconds since January 1 1970 UTC, indicating when this permission was originally issued.
                  sub:
                    type: string
                    description: Subject of the token, as defined in JWT [RFC7519].
                    example: Z5O3upPC88QrAjx00dis
                  aud:
                    type: string
                    description: Service-specific string identifier or list of string identifiers representing the intended audience for this token, as defined in JWT [RFC7519].
                    example: https://protected.example.net/resource
                  iss:
                    type: string
                    description: String representing the issuer of this token, as defined in JWT [RFC7519].
                    example: https://server.example.com/
                  acr_values:
                    type: string
                    description: Authentication Context Class Reference values.
                  jti:
                    type: string
                    description: String identifier for the token, as defined in JWT.
        400:
          description: Error codes for introspection endpoint.
          content:
            application/json:
              schema:
                title: AuthorizeError
                type: object
                required:
                - error
                - error_description
                properties:
                  error:
                    type: string
                    format: enum
                    example:
                    - invalid_request
                    - unauthorized_client
                    - disabled_client
                    - access_denied
                    - retry
                    - unsupported_response_type
                    - invalid_scope
                    - server_error
                    - temporarily_unavailable
                    - invalid_request_redirect_uri
                    - invalid_authorization_details
                    - login_required
                    - session_selection_required
                    - consent_required
                    - user_mismatched
                    - invalid_request_uri
                    - invalid_request_object
                    - authentication_session_invalid
                    - invalid_authentication_method
                  error_description:
                    type: string
                  details:
                    type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Token
      summary: The Introspection OAuth 2 Endpoint
      description: The Introspection OAuth 2 Endpoint.
      operationId: post-introspection
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Client Authorization details that contains the access token along with other details.
        schema:
          type: string
        example: Bearer 23410913-abewfq.123483
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: Client access token.
                  example: token=2YotnFZFEjr1zCsicMWpAA
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                title: IntrospectionResponse
                description: meta-information about token
                required:
                - active
                type: object
                properties:
                  active:
                    type: boolean
                    description: Boolean indicator of whether or not the presented token is currently active.
                    example: true
                  scope:
                    type: array
                    description: Provide list of scopes to which access was granted for this resource.
                    example:
                    - read write dolphin
                    items:
                      type: string
                  client_id:
                    type: string
                    description: Client identifier for the OAuth 2.0 client that requested this token.
                    example: 1238j323ds-23ij4
                  username:
                    type: string
                    description: Human-readable identifier for the resource owner who authorized this token.
                    example: jdoe
                  token_type:
                    type: string
                    description: Type of the token as defined in Section 5.1 of OAuth 2.0 [RFC6749].
                    example: bearer, mac
                  exp:
                    type: integer
                    description: Integer timestamp, measured in the number of seconds since January 1 1970 UTC, indicating when this permission will expire.
                  iat:
                    type: integer
                    example: Integer timestamp, measured in the number of seconds since January 1 1970 UTC, indicating when this permission was originally issued.
                  sub:
                    type: string
                    description: Subject of the token, as defined in JWT [RFC7519].
                    example: Z5O3upPC88QrAjx00dis
                  aud:
                    type: string
                    description: Service-specific string identifier or list of string identifiers representing the intended audience for this token, as defined in JWT [RFC7519].
                    example: https://protected.example.net/resource
                  iss:
                    type: string
                    description: String representing the issuer of this token, as defined in JWT [RFC7519].
                    example: https://server.example.com/
                  acr_values:
                    type: string
                    description: Authentication Context Class Reference values.
                  jti:
                    type: string
                    description: String identifier for the token, as defined in JWT.
        400:
          description: Error codes for introspection endpoint.
          content:
            application/json:
              schema:
                title: AuthorizeError
                type: object
                required:
                - error
                - error_description
                properties:
                  error:
                    type: string
                    format: enum
                    example:
                    - invalid_request
                    - unauthorized_client
                    - disabled_client
                    - access_denied
                    - retry
                    - unsupported_response_type
                    - invalid_scope
                    - server_error
                    - temporarily_unavailable
                    - invalid_request_redirect_uri
                    - invalid_authorization_details
                    - login_required
                    - session_selection_required
                    - consent_required
                    - user_mismatched
                    - invalid_request_uri
                    - invalid_request_object
                    - authentication_session_invalid
                    - invalid_authentication_method
                  error_description:
                    type: string
                  details:
                    type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://jans.local.io/jans-auth
  /restv1/revoke:
    post:
      tags:
      - Token
      summary: Revoke an Access Token or a Refresh Token, the RP (Client)
      description: Revoke an Access Token or a Refresh Token, the RP (Client).
      operationId: revoke
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: The token that the client wants to get revoked.
                token_type_hint:
                  type: string
                  description: A hint about the type of the token submitted for revocation.
      responses:
        200:
          description: OK
          content:
            content: {}
        400:
          description: Invalid parameters provided to endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - error_description
                properties:
                  error:
                    type: string
                    format: enum
                    example:
                    - unsupported_token_type
                    - invalid_client
                    - invalid_request
                  error_description:
                    type: string
                  details:
                    type: string
    servers:
    - url: https://jans.local.io/jans-auth
  /restv1/token:
    post:
      tags:
      - Token
      summary: To obtain an Access Token, an ID Token, and optionally a Refresh Token, the RP…
      description: To obtain an Access Token, an ID Token, and optionally a Refresh Token, the RP (Client).
      operationId: post-token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              properties:
                grant_type:
                  type: array
                  description: Provide a list of the OAuth 2.0 grant types that the Client is declaring that it will restrict itself to using.
                  example:
                  - authorization_code
                  - client_credentials
                  items:
                    type: string
                code:
                  type: string
                  description: Code which is returned by authorization endpoint. (For grant_type=authorization_code)
                redirect_uri:
                  type: string
                  description: Redirection URI to which the response will be sent. This URI MUST exactly match one of the Redirection URI values for the Client pre-registered at the OpenID Provider.
                username:
                  type: string
                  description: End-User username.
                password:
                  type: string
                  description: End-User password.
                scope:
                  type: array
                  description: OpenID Connect requests MUST contain the openid scope value. If the openid scope value is not present, the behavior is entirely unspecified. Other scope values MAY be present. Scope values used that are not understood by an implementation SHOULD be ignored.
                  items:
                    type: string
                assertion:
                  type: string
                  description: Assertion JWT. Used with grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer (e.g. ID-JAG bearer grant).
                refresh_token:
                  type: string
                  description: Refresh token.
                client_id:
                  type: string
                  description: OAuth 2.0 Client Identifier valid at the Authorization Server.
                client_secret:
                  type: string
                  description: The client secret.  The client MAY omit the parameter if the client secret is an empty string.
                code_verifier:
                  type: string
                  description: The client's PKCE code verifier.
                ticket:
                  type: string
                claim_token:
                  type: string
                claim_token_format:
                  type: string
                pct:
                  type: string
                rpt:
                  type: string
                subject_token:
                  type: string
                  description: Security token representing the identity of the party on behalf of whom the request is being made. Used with grant_type=urn:ietf:params:oauth:grant-type:token-exchange.
                subject_token_type:
                  type: string
                  description: Identifier for the type of subject_token. For example urn:ietf:params:oauth:token-type:id_token, urn:ietf:params:oauth:token-type:saml2, or urn:ietf:params:oauth:token-type:refresh_token.
                  example: urn:ietf:params:oauth:token-type:id_token
                requested_token_type:
                  type: string
                  description: Identifier for the type of the requested security token. For example urn:ietf:params:oauth:token-type:id-jag or urn:ietf:params:oauth:token-type:txn-token.
                  example: urn:ietf:params:oauth:token-type:id-jag
                audience:
                  type: string
                  description: The logical name of the target service or resource where the client intends to use the requested security token. Used with grant_type=urn:ietf:params:oauth:grant-type:token-exchange.
                actor_token:
                  type: string
                  description: Security token representing the actor. Used in delegation scenarios with grant_type=urn:ietf:params:oauth:grant-type:token-exchange.
                actor_token_type:
                  type: string
                  description: Identifier for the type of actor_token.
                  example: urn:x-oath:params:oauth:token-type:device-secret
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: AccessTokenResponse.
                required:
                - access_token
                - token_type
                properties:
                  access_token:
                    type: string
                    description: The access token issued by the authorization server.
                  token_type:
                    type: string
                    description: The access token type provides the client with the information required to successfully utilize the access token to make a protected resource request (along with type-specific attributes).
                  expires_in:
                    type: integer
                    description: The lifetime in seconds of the access token. For example, the value \"3600\" denotes that the access token will expire in one hour from the time the response was generated.
                  refresh_token:
                    type: string
                    description: The refresh token, which can be used to obtain new access tokens using the same authorization grant
                  scope:
                    type: array
                    example:
                    - openid
                    - oxd
                    items:
                      type: string
                  id_token:
                    type: string
                  issued_token_type:
                    type: string
                    description: Identifier for the type of the issued token. Present in token exchange responses. For example urn:ietf:params:oauth:token-type:id-jag or urn:ietf:params:oauth:token-type:txn-token.
                    example: urn:ietf:params:oauth:token-type:id-jag
        400:
          description: Invalid parameters provided to endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - error_description
                properties:
                  error:
                    type: string
                    format: enum
                    example:
                    - invalid_client_metadata
                    - invalid_token
                  error_description:
                    type: string
                  details:
                    type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/AccessDenied'
        500:
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://jans.local.io/jans-auth
  /api/v1/token/client/{clientId}:
    get:
      tags:
      - Token
      summary: Get token details by client
      description: Get token details by client.
      operationId: get-token-by-client
      parameters:
      - name: clientId
        in: path
        description: Client identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEntityPagedResult'
              examples:
                Response example:
                  description: Response example
                  value: "{\n    \"start\": 0,\n    \"totalEntriesCount\": 8,\n    \"entriesCount\": 8,\n    \"entries\": [\n        {\n            \"dn\": \"tknCde=280c8e7055fb51cee1fdd6442fe7fdba98dfd319f0e931ac0756a19936722286,ou=tokens,o=jans\",\n            \"grantId\": \"5e3d27ba-00a2-400e-be6d-b1424d1c1f33\",\n            \"clientId\": \"2000.cc8b29ae-cb4a-49ea-b176-8695e53919d9\",\n            \"creationDate\": \"2024-09-23T15:03:50\",\n            \"expirationDate\": \"2024-10-23T15:03:50\",\n            \"deletable\": true,\n            \"scope\": \"jans_stat openid https://jans.io/oauth/jans-auth-server/config/adminui/properties.readonly https://jans.io/oauth/jans-auth-server/config/adminui/license.write https://jans.io/oauth/config/stats.readonly https://jans.io/oauth/jans-auth-server/config/adminui/license.readonly\",\n            \"tokenCode\": \"280c8e7055fb51cee1fdd6442fe7fdba98dfd319f0e931ac0756a19936722286\",\n            \"tokenType\": \"access_token\",\n            \"grantType\": \"client_credentials\",\n            \"referenceId\": \"4zdnUjyjRoWqqLCMtguvDA\",\n            \"attributes\": {\n                \"online_access\": false,\n                \"statusListIndex\": 301\n            },\n            \"tokenTypeEnum\": \"ACCESS_TOKEN\"\n        },\n        {\n            \"dn\": \"tknCde=3d4e9ea9ff6fe85f25dc4fa98cf672c885d30b58fd2f64f8e7c630113d7e568f,ou=tokens,o=jans\",\n            \"grantId\": \"f8bfb7d5-0dbc-4976-a0ec-ef82e90e4ab8\",\n            \"clientId\": \"2000.cc8b29ae-cb4a-49ea-b176-8695e53919d9\",\n            \"creationDate\": \"2024-09-23T08:23:50\",\n            \"expirationDate\": \"2024-10-23T08:23:50\",\n            \"deletable\": true,\n            \"scope\": \"https://jans.io/oauth/config/jwks.delete https://jans.io/oauth/jans-auth-server/session.readonly https://jans.io/oauth/jans-auth-server/config/adminui/webhook.readonly https://jans.io/oauth/config/scopes.readonly https://jans.io/oauth/config/saml.write https://jans.io