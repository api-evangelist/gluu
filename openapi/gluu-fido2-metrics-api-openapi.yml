        description: End date/time for the log entries. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonNode'
              examples:
                Response example:
                  description: Response example
                  value: "{\n    \"operatingSystems\": {},\n    \"deviceTypes\": {},\n    \"authenticatorTypes\": {\n        \"cross-platform\": 1\n    },\n    \"browsers\": {}\n}\n"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/fido2-metrics.readonly
      - oauth2:
        - https://jans.io/oauth/config/fido2.write
      - oauth2:
        - https://jans.io/oauth/config/fido2.admin
      - oauth2:
        - https://jans.io/oauth/config/read-all
      - oauth2:
        - https://jans.io/oauth/config/write-all
    servers:
    - url: https://jans.io/
      description: The Jans server
  /fido2/metrics/analytics/errors:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get Fido2 error analysis metrics by time range
      description: Get Fido2 error analysis metrics by time range.
      operationId: get-fido2-metrics-analytics-errors
      parameters:
      - name: start_date
        in: query
        description: Start date/time for the log entries report. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date/time for the log entries. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      - name: operationType
        in: query
        description: 'Operation type to report on: REGISTRATION or AUTHENTICATION. Omit to report both together, in which case every rate covers registration and authentication combined.'
        schema:
          type: string
          enum:
          - REGISTRATION
          - AUTHENTICATION
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonNode'
              examples:
                Response example:
                  description: Response example
                  value: "{\n    \"errorCategories\": {},\n    \"failureRate\": 0.75,\n    \"successRate\": 0.25,\n\t\"completionRate\": 0.48,\n\t\"dropOffRate\": 0.52,\n    \"topErrors\": {}\n}\n"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/fido2-metrics.readonly
      - oauth2:
        - https://jans.io/oauth/config/fido2.write
      - oauth2:
        - https://jans.io/oauth/config/fido2.admin
      - oauth2:
        - https://jans.io/oauth/config/read-all
      - oauth2:
        - https://jans.io/oauth/config/write-all
    servers:
    - url: https://jans.io/
      description: The Jans server
  /fido2/metrics/aggregations/{aggregationType}:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get a list of Fido2 aggregated metrics by time range
      description: Get a list of Fido2 aggregated metrics by time range.
      operationId: get-fido2-metrics-aggregated
      parameters:
      - name: limit
        in: query
        description: Search size - max size of the results to return
        schema:
          type: integer
          format: int32
          default: 50
      - name: startIndex
        in: query
        description: The 0-based index of the first query result
        schema:
          type: integer
          format: int32
          default: 0
      - name: aggregationType
        in: path
        description: ' Aggregation Type'
        required: true
        schema:
          type: string
          default: ''
      - name: start_date
        in: query
        description: Start date/time for the log entries report. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
