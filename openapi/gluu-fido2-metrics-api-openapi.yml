  /jans-fido2/restv1/metrics/analytics/performance:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get performance analytics
      description: Returns performance statistics (average, min, max durations in milliseconds for registration and authentication). Durations cover only ceremonies that completed - SUCCESS or FAILURE. An abandoned ceremony's recorded duration is how long it stayed open before the sweep claimed it, which measures unfinishedRequestExpiration rather than user-perceived latency, so including it would make these figures track the configured window instead of the server. The keys for an operation type are absent when nothing completed in the range.
      operationId: get-metrics-analytics-performance
      parameters:
      - name: startTime
        in: query
        required: true
        schema:
          type: string
        description: Start time (ISO 8601, UTC).
      - name: endTime
        in: query
        required: true
        schema:
          type: string
        description: End time (ISO 8601, UTC).
      responses:
        200:
          description: Performance analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsPerformance'
        400:
          $ref: '#/components/responses/InvalidRequest'
        403:
          $ref: '#/components/responses/AccessDenied'
        500:
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://jans.local.io
  /jans-fido2/restv1/metrics/analytics/devices:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get device analytics
      description: 'Returns device analytics (device types, OS, browsers, authenticator types). Counts are per completed ceremony, not per recorded entry: a ceremony writes an ATTEMPT when it starts and a terminal entry when it resolves, so counting entries reported one sign-in more than once. Abandoned ceremonies do not appear - abandonment is recorded off a request thread, which has no device details to read. Still approximate in multi-node deployments, where a ceremony can be recorded more than once.'
      operationId: get-metrics-analytics-devices
      parameters:
      - name: startTime
        in: query
        required: true
        schema:
          type: string
        description: Start time (ISO 8601, UTC).
      - name: endTime
        in: query
        required: true
        schema:
          type: string
        description: End time (ISO 8601, UTC).
      responses:
        200:
          description: Device analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsDeviceAnalytics'
        400:
          $ref: '#/components/responses/InvalidRequest'
        403:
          $ref: '#/components/responses/AccessDenied'
        500:
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://jans.local.io
  /jans-fido2/restv1/metrics/analytics/errors:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get error analytics
      description: Returns error analysis (categories, top errors, success/failure rates). Without operationType the tally covers registration and authentication together, which cannot distinguish a deployment with healthy sign-in and poor enrolment from the reverse - pass operationType to report one ceremony at a time.
      operationId: get-metrics-analytics-errors
      parameters:
      - name: startTime
        in: query
        required: true
        schema:
          type: string
        description: Start time (ISO 8601, UTC).
      - name: endTime
        in: query
        required: true
        schema:
          type: string
        description: End time (ISO 8601, UTC).
      - name: operationType
        in: query
        required: false
        schema:
          type: string
          enum:
          - REGISTRATION
          - AUTHENTICATION
        description: Report this ceremony alone. Omit to report both together, which is the long-standing behaviour of this endpoint.
      responses:
        200:
          description: Error analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsErrorAnalytics'
        400:
          $ref: '#/components/responses/InvalidRequest'
        403:
          $ref: '#/components/responses/AccessDenied'
        500:
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://jans.local.io
  /jans-fido2/restv1/metrics/analytics/attestation-rejections:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get attestation rejection analytics
      description: Returns attestation rejections broken down by trust diagnostic code. An unknown AAGUID, an authenticator blocked by an MDS status report and an untrusted root certificate are otherwise indistinguishable from each other, and from any other registration failure. Reads the same metrics store as the error analytics endpoint.
      operationId: get-metrics-analytics-attestation-rejections
      parameters:
      - name: startTime
        in: query
        required: true
        schema:
          type: string
        description: Start time (ISO 8601, UTC).
      - name: endTime
        in: query
        required: true
        schema:
          type: string
        description: End time (ISO 8601, UTC).
      responses:
        200:
          description: Attestation rejection analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationRejectionAnalytics'
        400:
          $ref: '#/components/responses/InvalidRequest'
        403:
          $ref: '#/components/responses/AccessDenied'
        500:
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://jans.local.io
  /jans-fido2/restv1/metrics/analytics/trends/{aggregationType}:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get trend analysis
      description: Returns trend data over time for the chosen aggregation granularity, with insights (e.g. direction, growth rate). Built from stored aggregations rather than recomputed, so periods aggregated before 2.4.0 still carry the duration and device figures computed at the time and should be read as legacy data.
      operationId: get-metrics-analytics-trends
      parameters:
      - name: aggregationType
        in: path
        required: true
        schema:
          type: string
          enum:
          - HOURLY
          - DAILY
          - WEEKLY
          - MONTHLY
      - name: startTime
