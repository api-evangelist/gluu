      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fido2MetricsAggregationPagedResult'
              examples:
                Response example:
                  description: Response example
                  value: "{\n    \"start\": 0,\n    \"totalEntriesCount\": 1,\n    \"entriesCount\": 1,\n    \"entries\": [\n        {\n            \"dn\": \"jansId=HOURLY_2026-02-20-15,ou=fido2-aggregations,o=jans\",\n            \"id\": \"HOURLY_2026-02-20-15\",\n            \"aggregationType\": \"HOURLY\",\n            \"startTime\": \"2026-02-20T15:00:00\",\n            \"endTime\": \"2026-02-20T16:00:00\",\n            \"uniqueUsers\": 1,\n            \"lastUpdated\": \"2026-02-20T16:05:00\",\n            \"fallbackEvents\": 0,\n            \"registrationSuccessRate\": 0.25,\n            \"authenticationAttempts\": 0,\n            \"metricsData\": {\n                \"deviceTypes\": {\n                    \"cross-platform\": 1\n                },\n                \"fallbackEvents\": 0,\n                \"registrationAttempts\": 4,\n                \"registrationFailures\": 3,\n                \"registrationSuccesses\": 1,\n                \"authenticationAttempts\": 0,\n                \"authenticationFailures\": 0,\n                \"authenticationSuccesses\": 0,\n                \"registrationAvgDuration\": 471.0,\n                \"registrationSuccessRate\": 0.25\n            },\n            \"period\": \"2026-02-20-15\",\n            \"registrationAttempts\": 4,\n            \"registrationSuccesses\": 1,\n            \"registrationFailures\": 3,\n            \"authenticationSuccesses\": 0,\n            \"authenticationFailures\": 0,\n            \"registrationAvgDuration\": 471.0,\n            \"deviceTypes\": {\n                \"cross-platform\": 1\n            },\n            \"baseDn\": \"jansId=HOURLY_2026-02-20-15,ou=fido2-aggregations,o=jans\"\n        }\n    ]\n}\n"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/fido2-metrics.readonly
      - oauth2:
        - https://jans.io/oauth/config/fido2.write
      - oauth2:
