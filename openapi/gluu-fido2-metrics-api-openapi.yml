openapi: 3.2.0
info:
  title: Gluu Fido2 - Metrics API
  version: '1.0'
  description: 'Operations tagged Fido2 - Metrics across 2 of this provider''s published API definitions: gluu-jans-config-api-fido2-plugin-openapi.yml, gluu-jans-fido2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://jans.io/
  description: The Jans server
- url: https://jans.local.io
tags:
- name: Fido2 - Metrics
paths:
  /fido2/metrics/analytics/adoption:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get Fido2 adoption metrics by time range
      description: Get Fido2 adoption metrics by time range.
      operationId: get-fido2-adoption-metrics
      parameters:
      - name: start_date
        in: query
        description: Start date/time for the log entries report. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date/time for the log entries. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonNode'
              examples:
                Response example:
                  description: Response example
                  value: "{\n    \"newUsers\": 1,\n    \"returningUsers\": 0,\n    \"adoptionRate\": 1,\n    \"totalUniqueUsers\": 1\n}\n"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/fido2-metrics.readonly
      - oauth2:
        - https://jans.io/oauth/config/fido2.write
      - oauth2:
        - https://jans.io/oauth/config/fido2.admin
      - oauth2:
        - https://jans.io/oauth/config/read-all
      - oauth2:
        - https://jans.io/oauth/config/write-all
    servers:
    - url: https://jans.io/
      description: The Jans server
  /fido2/metrics/analytics/attestation-rejections:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get Fido2 attestation rejection analytics by time range
      description: Get Fido2 attestation rejections broken down by trust diagnostic code.
      operationId: get-fido2-metrics-analytics-attestation-rejections
      parameters:
      - name: start_date
        in: query
        description: Start date/time for the log entries report. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date/time for the log entries. Accepted format dd-MM-yyyy or ISO-8601 date-time like yyyy-MM-ddTHH:mm:ssZ, for example, 31-12-2025 and 2025-12-31T23:59:59Z.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonNode'
              examples:
                Response example:
                  description: Response example
                  value: "{\n    \"totalRejections\": 37,\n    \"registrationAttempts\": 412,\n    \"rejectionRate\": 0.0898,\n    \"reasonCodes\": {\n        \"JFS_AAGUID_NOT_IN_MDS\": 21,\n        \"JFS_AUTHENTICATOR_STATUS_UNACCEPTABLE\": 9,\n        \"JFS_ROOT_CERT_NOT_TRUSTED\": 5,\n        \"JFS_ATTESTATION_FORMAT_NOT_PERMITTED\": 2\n    },\n    \"topRejectedAaguids\": {\n        \"d8522d9f-575b-4866-88a9-ba99fa02f35b\": 14,\n        \"cb69481e-8ff7-4039-93ec-0a2729a154a8\": 9,\n        \"2fc0579f-8113-47ea-b116-bb5a8db9202a\": 7\n    }\n}\n"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/fido2-metrics.readonly
      - oauth2:
        - https://jans.io/oauth/config/fido2.write
      - oauth2:
        - https://jans.io/oauth/config/fido2.admin
      - oauth2:
        - https://jans.io/oauth/config/read-all
      - oauth2:
        - https://jans.io/oauth/config/write-all
    servers:
    - url: https://jans.io/
      description: The Jans server
  /fido2/metrics/analytics/devices:
    get:
      tags:
      - Fido2 - Metrics
      summary: Get Fido2 devices analytics metrics by time range
      description: Get Fido2 devices analytics metrics by time range.
      operationId: get-fido2-metrics-analytics-devices
      parameters:
