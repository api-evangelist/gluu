    delete:
      tags:
      - Fido2 - Registration
      summary: Delete Fido2 Device Data based on device UID
      operationId: delete-fido2-data
      parameters:
      - name: jansId
        in: path
        description: Fido2Registration Unique identifier.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
