- aid: gluu:jans-config-api
  name: Janssen Config API
  description: >-
    The Janssen Config API is the OAuth-protected administrative REST API for every Janssen Server and
    Gluu Flex component — clients, scopes, custom scripts, Agama flows, attributes, SMTP, persistence,
    logging, SAML and more. 133 operations across 78 paths in the core spec, plus seven plugin specs
    covering FIDO2, the Admin UI, user management, Jans Lock audit, metrics, Jans Link and SCIM config.
