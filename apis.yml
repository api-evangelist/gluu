- aid: gluu:janssen-project
  name: Janssen Project
  description: The Janssen Project is the upstream Linux Foundation open-source identity platform that
    powers Gluu Flex. It implements OAuth 2.0, OpenID Connect, FIDO 2.0, SCIM, UMA, and CIBA, providing
    a federated identity provider, authorization server, and FIDO server.
