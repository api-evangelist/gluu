aid: gluu
name: Gluu
description: >-
  Gluu is a technology company that specializes in providing identity and
  access management solutions for businesses. Their platform allows
  organizations to centrally manage the authentication and authorization of
  users across various applications and systems, ensuring secure access to
  sensitive data and resources. Gluu leads the Linux Foundation Janssen Project,
  whose OAuth 2.0 / OpenID Connect authorization server, SCIM 2.0 service,
  FIDO2 server, Config API and Cedarling policy decision point are the
  components Gluu packages commercially as Gluu Flex and hosts as Gluu Solo.
