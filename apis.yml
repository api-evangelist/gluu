- aid: gluu:gluu-solo
  name: Gluu Solo
  description: Gluu Solo is Gluu's hosted, serverless SaaS identity provider, running the Janssen stack
    on Google Cloud with customer-selected geographic locations, published per-location monthly and annual
    pricing, and a 99.9% SLA on every tier. It is the managed counterpart to the self-hosted Gluu Flex
    distribution.
