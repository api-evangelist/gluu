- aid: gluu:jans-auth-server-api
  name: Janssen Auth Server API
  description: >-
    The Janssen Authorization Server REST API — a certified OpenID Provider implementing OAuth 2.0,
    OpenID Connect Core, dynamic client registration, CIBA backchannel authentication, UMA 2.0 resource
    registration, Pushed Authorization Requests, Software Statement Assertions, token status lists and an
    AuthZEN configuration endpoint. 46 operations across 33 paths.
  humanURL: https://docs.jans.io/stable/janssen-server/auth-server/
