  name: Gluu Flex
  description: Gluu Flex is the commercial, self-hosted enterprise distribution of the Linux Foundation
    Janssen Project. It provides a cloud-native digital identity platform with OAuth 2.0, OpenID Connect,
    FIDO, SCIM, and UMA capabilities, deployable via Helm charts with auto-scaling support.
