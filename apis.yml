- aid: gluu:cedarling
  name: Cedarling
  description: Cedarling is an embeddable Policy Decision Point (PDP) built in Rust that runs anywhere
    and returns authorization decisions in under 50 microseconds based on declarative Cedar access policies.
    It validates JWT tokens and applies policies to deliver fine-grained authorization.
