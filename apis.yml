apis:
- aid: gluu:gluu-flex
  name: Gluu Flex
  description: >-
    Gluu Flex is the commercial, self-hosted enterprise distribution of the Linux Foundation Janssen Project.
    It provides a cloud-native digital identity platform with OAuth 2.0, OpenID Connect, FIDO, SCIM, and
    UMA capabilities, deployable via Helm charts with auto-scaling support.
  humanURL: https://gluu.org/flex/
  baseURL: https://docs.gluu.org/
  tags:
  - Authentication
  - Authorization
  - IAM
  - OAuth
  - OpenID Connect
  properties:
  - type: Documentation
    url: https://docs.gluu.org/
  - type: GettingStarted
    url: https://docs.gluu.org/head/admin-guide/quick-start/
  - type: GitHubRepository
    url: https://github.com/GluuFederation/flex
  - type: Pricing
    url: https://gluu.org/pricing/
- aid: gluu:janssen-project
  name: Janssen Project
  description: >-
    The Janssen Project is the upstream Linux Foundation open-source identity platform that powers Gluu
    Flex. It implements OAuth 2.0, OpenID Connect, FIDO 2.0, SCIM, UMA, and CIBA, providing a federated
    identity provider, authorization server, and FIDO server.
  humanURL: https://jans.io/
  baseURL: https://docs.jans.io/
  tags:
  - Authentication
  - Authorization
  - Linux Foundation
  - OAuth
  - Open Source
  - OpenID Connect
  properties:
  - type: Documentation
    url: https://docs.jans.io/
  - type: GitHubRepository
    url: https://github.com/JanssenProject/jans
  - type: Reference
    url: https://docs.jans.io/head/admin/reference/
- aid: gluu:cedarling
  name: Cedarling
  description: >-
    Cedarling is an embeddable Policy Decision Point (PDP) built in Rust that runs anywhere and returns
    authorization decisions in under 50 microseconds based on declarative Cedar access policies. It validates
    JWT tokens and applies policies to deliver fine-grained authorization.
  humanURL: https://gluu.org/cedarling/
  tags:
  - Authorization
  - Cedar
  - PDP
  - Policy
  - Rust
  properties:
  - type: Documentation
    url: https://docs.jans.io/head/cedarling/cedarling-overview/
  - type: GitHubRepository
    url: https://github.com/JanssenProject/jans/tree/main/jans-cedarling
- aid: gluu:agama-lab
  name: Agama Lab
  description: >-
    Agama Lab is a developer portal for authoring Cedar schema and policies, building authentication workflows
    using the Agama domain specific language, and managing hosted Gluu infrastructure.
  humanURL: https://gluu.org/agama-lab/
