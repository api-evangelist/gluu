- product: janssen
  version: 2.4.0
  date: '2026-09-07'
  breaking: unknown
  highlights:
  - Cedarling automatic cleanup via Drop.
  - FIDO2 retries the MDS TOC download at startup when the blob is unavailable; metrics columns widened.
  - FIDO2 exposes an effective attestation-mode status endpoint.
  - Agama transpiler conformance tests for template-override, finish and log codegen.
  - SLSA provenance uploaded to releases; OpenSSF-reported vulnerable dependencies remediated.
  - Auth Server KeyGenerator exits non-zero on a JWKS generation error.
  note: >-
    Release notes are a conventional-commit list with PR links; the project does not label breaking
    changes separately, so `breaking` cannot be asserted from the notes alone.
