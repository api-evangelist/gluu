note: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that invented a Free/Professional/Enterprise ladder
  with 1,000 and 100,000 request quotas. None of that existed. What Gluu actually publishes is the Solo
  table below; Gluu Flex is quoted on peak monthly active users with no public number, and the Janssen
  Project is free open source.
