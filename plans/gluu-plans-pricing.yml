unpriced_products:
  - product: Gluu Flex
    model: subscription, quoted
    basis: peak Monthly Active Users
    public_price: false
    detail: >-
      https://gluu.org/flex/ states the subscription is priced on peak monthly active users and routes to
      https://gluu.org/booking to schedule a demo. https://gluu.org/pricing/ returns 404. No public number.
    note: >-
      The page does publish one commercially meaningful term: if the subscription expires the commercial
      Admin UI locks, but the authentication service keeps running because the core components are open
      source.
  - product: Janssen Project
    model: free open source
    public_price: true
    price: '0.00'
    detail: Apache-2.0, Linux Foundation; no licence fee. https://github.com/JanssenProject/jans
  - product: Agama Lab
    model: not published
    public_price: false
    detail: >-
      No pricing statement on https://gluu.org/agama-lab/; the CTA is "Join Agama Lab" at
      https://cloud.gluu.org/agama-lab.
free_trial:
  published: false
  detail: >-
    No free trial is advertised on any pricing surface. The Admin UI plugin contract does carry a
    GET /admin-ui/license/trial operation, so a trial licence exists as a product mechanism, but Gluu
    publishes no terms for it.
  evidence: openapi/gluu-jans-config-api-admin-ui-plugin-openapi.yml
