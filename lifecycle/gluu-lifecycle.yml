deprecation:
  policy_published: false
  sunset_headers: false
  detail: >-
    No API deprecation policy, no Sunset/Deprecation header (RFC 8594), and no `deprecated: true` flag on
    any operation in the twelve first-party specs. The closest published commitment is the Janssen
    security policy's supported-versions table — ">=1.0.0 supported, <1.0.0 not" with "security updates
    will typically only be applied to the latest release" — which is a patch-support statement, not a
    deprecation policy for API surfaces. No Deprecation pointer is emitted in apis.yml for that reason.
  evidence: https://github.com/JanssenProject/jans/blob/main/.github/SECURITY.md
  deprecated_operations: []
status_page:
  published: false
  detail: >-
    No status page exists. status.gluu.org does not resolve to a listener, and https://gluu.org/status/,
    https://gluu.org/gluu-server-status/ and https://gluu.org/sla/ all return 404. For self-hosted Flex
    that is expected — there is no Gluu-operated plane to report on — but hosted Gluu Solo advertises a
    99.9% SLA on every tier with no public uptime reporting behind it.
